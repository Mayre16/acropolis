name: Deploy GitHub Pages

# Producción en dominio custom (acropolis.org.do):
# publica el sitio principal en la raíz de gh-pages, sin basePath de preview.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync CMS seed for build (fallback sin API)
        run: |
          mkdir -p editor/data/acropolis
          if [ -f principal/data/acropolis/published.json ]; then
            cp principal/data/acropolis/published.json editor/data/acropolis/published.json
          fi

      - name: Build principal for acropolis.org.do
        working-directory: principal
        env:
          NEXT_PUBLIC_SITE_URL: ${{ secrets.PRINCIPAL_SITE_URL || 'https://acropolis.org.do' }}
          NEXT_PUBLIC_CMS_URL: ${{ secrets.CMS_API_URL || 'https://editor.acropolis.adesa.com.do/api' }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.PRINCIPAL_GA_MEASUREMENT_ID }}
          NEXT_PUBLIC_GSC_VERIFICATION: ${{ secrets.PRINCIPAL_GSC_VERIFICATION }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          # Sin NEXT_PUBLIC_BASE_PATH → assets en /na-assets/... (raíz del dominio)
        run: npm ci && npm run build:cpanel

      # Compat: bookmarks / caché del redirect viejo a /principal/
      - name: Add /principal → / redirect stub
        run: |
          mkdir -p principal/out/principal
          printf '%s\n' \
            '<!DOCTYPE html>' \
            '<html lang="es">' \
            '<head>' \
            '<meta charset="utf-8" />' \
            '<meta http-equiv="refresh" content="0; url=/" />' \
            '<link rel="canonical" href="https://acropolis.org.do/" />' \
            '<title>Nueva Acrópolis RD</title>' \
            '</head>' \
            '<body><p>Redirigiendo a <a href="/">acropolis.org.do</a>…</p></body>' \
            '</html>' \
            > principal/out/principal/index.html

      - name: Deploy principal to gh-pages (site root)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: principal/out
          publish_branch: gh-pages
          force_orphan: true
          cname: acropolis.org.do
