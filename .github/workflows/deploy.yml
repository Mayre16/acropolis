name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [cms-publish]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js (producción acropolis.org.do)
        env:
          NEXT_PUBLIC_SITE_URL: https://acropolis.org.do
          NEXT_PUBLIC_CMS_URL: https://editor.acropolis.adesa.com.do/api
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          # Sin NEXT_PUBLIC_BASE_PATH → assets en /na-assets/...
        run: npm run build:cpanel

      - name: Add /principal → / redirect stub
        run: |
          mkdir -p out/principal
          cat > out/principal/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="es">
          <head>
            <meta charset="utf-8" />
            <meta http-equiv="refresh" content="0; url=/" />
            <link rel="canonical" href="https://acropolis.org.do/" />
            <title>Nueva Acrópolis RD</title>
          </head>
          <body><p>Redirigiendo a <a href="/">acropolis.org.do</a>…</p></body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
